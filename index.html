<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算力加速团队-民主生活会分享抽选</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600;700&family=Long+Cang&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8eef9;
    --bg2:#f2f5fb;
    --panel:rgba(255,255,255,0.72);
    --panel-solid:#ffffff;
    --border:rgba(20,40,90,0.14);
    --border-soft:rgba(20,40,90,0.07);
    --text:#0e1b3a;
    --text-soft:#3c4a6b;
    --muted:#76829e;
    --cyan:#0891b2;
    --blue:#2563eb;
    --purple:#7c3aed;
    --teal:#0d9488;
    --pink:#db2777;
    --grad:linear-gradient(120deg,#06b6d4,#3b82f6,#8b5cf6);
    --serif:"Cormorant Garamond","Noto Serif SC",Georgia,"Times New Roman",serif;
    --fancy:"Long Cang","Noto Serif SC",var(--serif);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"Orbitron",var(--sans);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 600px at 10% 6%, rgba(59,130,246,.16) 0%, transparent 60%),
      radial-gradient(900px 600px at 90% 10%, rgba(139,92,246,.14) 0%, transparent 60%),
      radial-gradient(900px 700px at 82% 94%, rgba(6,182,212,.14) 0%, transparent 60%),
      radial-gradient(700px 600px at 6% 92%, rgba(219,39,119,.10) 0%, transparent 60%),
      linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.6;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
    background-image:radial-gradient(rgba(20,40,90,0.07) 1px,transparent 1px),radial-gradient(rgba(20,40,90,0.04) 1px,transparent 1px);
    background-size:28px 28px,84px 84px;
  }

  .doodle{position:absolute;pointer-events:none;z-index:0;opacity:.42}
  .d1{top:6%;left:4%;color:var(--cyan);animation:floaty 9s ease-in-out infinite}
  .d2{top:14%;right:7%;color:var(--blue);animation:floaty 11s ease-in-out infinite reverse}
  .d3{bottom:12%;left:5%;color:var(--purple);animation:floaty 10s ease-in-out infinite}
  .d4{bottom:18%;right:6%;color:var(--teal);animation:floaty 12s ease-in-out infinite reverse}
  .d5{top:44%;left:2.5%;color:var(--pink);animation:floaty 13s ease-in-out infinite}
  .d6{top:62%;right:3%;color:var(--cyan);animation:floaty 8.5s ease-in-out infinite reverse}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(8deg)}}

  .wrap{max-width:1120px;margin:0 auto;padding:54px 32px 80px;position:relative;z-index:1}

  header{text-align:center;margin-bottom:46px;position:relative}
  .emblem{margin:0 auto 16px;width:56px;height:56px;display:block}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.42em;text-transform:uppercase;
    color:var(--blue);margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:18px;
  }
  .eyebrow::before,.eyebrow::after{content:"";width:64px;height:1px;background:linear-gradient(90deg,transparent,rgba(37,99,235,.5),transparent)}
  h1{
    font-family:var(--serif);font-weight:600;font-size:clamp(34px,5vw,54px);
    letter-spacing:.04em;line-height:1.1;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{margin-top:12px;font-size:14px;color:var(--text-soft);letter-spacing:.06em;font-style:italic;font-family:var(--serif)}
  .ribbon{display:flex;justify-content:center;gap:8px;margin-top:18px;color:var(--blue);opacity:.55}

  /* Drawn (highlight) */
  .drawn{
    text-align:center;min-height:214px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:34px 16px;margin-bottom:46px;position:relative;
    background:linear-gradient(180deg,#ffffff,rgba(255,255,255,.7));
    border:1px solid var(--border);border-radius:14px;
    box-shadow:0 24px 60px -26px rgba(37,99,235,.28),inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter:blur(12px);
  }
  .drawn::before,.drawn::after{content:"";position:absolute;top:16px;width:20px;height:20px;border:1px solid var(--blue);opacity:.6}
  .drawn::before{left:16px;border-right:none;border-bottom:none}
  .drawn::after{right:16px;border-left:none;border-bottom:none}
  .drawn-label{font-family:var(--mono);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--blue);margin-bottom:24px;display:flex;align-items:center;gap:10px;justify-content:center}
  .drawn-grid{display:flex;flex-wrap:wrap;gap:34px;justify-content:center;align-items:flex-end}
  .drawn-empty{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:19px}

  /* Avatar */
  .avatar{
    width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--fancy);font-weight:400;font-size:24px;line-height:1;
    border:1.5px solid var(--border);background:#fff;color:var(--text);
    transition:all .5s cubic-bezier(.2,.7,.2,1);position:relative;letter-spacing:.04em;
  }
  .avatar.drawn-big{
    width:124px;height:124px;font-size:46px;
    border:3px solid transparent;
    background:
      linear-gradient(#fff,#fff) padding-box,
      var(--grad) border-box;
    color:var(--text);
    box-shadow:0 0 0 6px rgba(59,130,246,.10),0 14px 40px -10px rgba(59,130,246,.35);
  }
  .avatar.drawn-big::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(59,130,246,.3);opacity:.7}
  .avatar.is-shared{opacity:.42;background:#eef1f6;border-color:var(--border-soft)}
  .avatar.tone-1{color:var(--cyan);border-color:rgba(8,145,178,.4);background:#e6f7fb}
  .avatar.tone-2{color:var(--blue);border-color:rgba(37,99,235,.4);background:#e8effe}
  .avatar.tone-3{color:var(--purple);border-color:rgba(124,58,237,.4);background:#efe9fe}
  .avatar.tone-4{color:var(--teal);border-color:rgba(13,148,136,.4);background:#e4f7f3}
  .avatar.tone-5{color:var(--pink);border-color:rgba(219,39,119,.4);background:#fde8f1}
  .name{margin-top:11px;font-size:13px;letter-spacing:.04em;color:var(--text-soft)}
  .name.drawn-name{font-family:var(--serif);font-size:20px;color:var(--text);font-weight:600;letter-spacing:.08em}
  .person{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:104px}
  .avatar.spinning{color:var(--blue);border-color:rgba(59,130,246,.6);opacity:.95}

  /* Controls */
  .controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:18px;margin-bottom:48px}
  .pick-count{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-soft)}
  .pick-count input{
    width:64px;height:42px;text-align:center;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);
    font-family:var(--mono);font-size:18px;outline:none;transition:border-color .2s,box-shadow .2s;
  }
  .pick-count input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  .btn{
    appearance:none;border:1px solid var(--border);background:#fff;color:var(--text);
    font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    padding:13px 30px;cursor:pointer;transition:all .25s;border-radius:9px;position:relative;
  }
  .btn:hover{border-color:var(--blue);color:var(--blue);box-shadow:0 8px 24px -8px rgba(59,130,246,.3)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--grad);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 8px 24px -8px rgba(59,130,246,.5)}
  .btn.primary:hover{filter:brightness(1.05);color:#fff;box-shadow:0 12px 32px -8px rgba(59,130,246,.6)}
  .btn.primary:disabled{background:#cfd6e6;color:#fff;box-shadow:none;opacity:.6}
  .btn.ghost{border-color:var(--border);color:var(--text-soft);font-size:11px;padding:11px 22px;background:rgba(255,255,255,.5)}
  .btn.ghost:hover{border-color:var(--blue);color:var(--blue)}

  /* Status columns */
  .status{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:48px}
  .col{
    background:linear-gradient(180deg,#ffffff,rgba(255,255,255,.6));
    border:1px solid var(--border);border-radius:14px;padding:30px 28px;position:relative;overflow:hidden;
    backdrop-filter:blur(12px);box-shadow:0 18px 50px -28px rgba(37,99,235,.3),inset 0 1px 0 rgba(255,255,255,.9);
  }
  .col::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .col.pool::before{background:linear-gradient(180deg,var(--cyan),var(--teal))}
  .col.shared::before{background:linear-gradient(180deg,var(--purple),var(--pink))}
  .col-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--border-soft)}
  .col-title{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:11px;color:var(--text)}
  .col-title .dot{width:9px;height:9px;border-radius:50%}
  .col.pool .dot{background:var(--cyan)} .col.shared .dot{background:var(--purple)}
  .col-count{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--text-soft)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:26px 8px}

  .note{text-align:center;font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:14px}
  .note .hr{width:90px;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}

  .toast{
    position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);
    background:var(--text);color:#fff;padding:14px 30px;border-radius:10px;
    font-size:13px;letter-spacing:.06em;opacity:0;pointer-events:none;transition:all .35s;z-index:80;
    border:1px solid rgba(59,130,246,.5);box-shadow:0 12px 30px -8px rgba(37,99,235,.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(14,27,58,.4);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:90;padding:24px}
  .overlay.show{display:flex}
  .modal{background:#fff;border:1px solid var(--border);border-radius:14px;max-width:600px;width:100%;padding:36px 32px;position:relative;box-shadow:0 30px 80px -30px rgba(37,99,235,.4)}
  .modal h2{font-family:var(--serif);font-size:26px;font-weight:600;margin-bottom:6px;letter-spacing:.03em;color:var(--text)}
  .modal .hint{font-size:12px;color:var(--text-soft);letter-spacing:.04em;margin-bottom:20px;line-height:1.7}
  .modal .close{position:absolute;top:14px;right:18px;background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;font-family:var(--serif);line-height:1}
  .modal .close:hover{color:var(--text)}
  .modal-actions{display:flex;justify-content:flex-end;gap:14px;margin-top:22px}
  .sec-title{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--blue);margin:6px 0 10px}
  .add-row{display:flex;gap:10px;margin-bottom:22px}
  .add-row textarea{flex:1;min-height:84px;resize:vertical;border:1px solid var(--border);border-radius:9px;background:#f7f9fd;font-family:var(--sans);font-size:14px;line-height:1.8;color:var(--text);padding:12px;outline:none;transition:border-color .2s,box-shadow .2s}
  .add-row textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
  .add-side{display:flex;flex-direction:column;justify-content:flex-end;gap:8px}

  .mgr-list{max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:9px;background:#f7f9fd;margin-bottom:18px}
  .mgr-list::-webkit-scrollbar{width:8px}.mgr-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .mgr-row{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--border-soft)}
  .mgr-row:last-child{border-bottom:none}
  .mgr-row .avatar{width:42px;height:42px;font-size:20px;flex:none}
  .mgr-name{flex:1;font-size:14px;color:var(--text);letter-spacing:.04em}
  .mgr-state{font-family:var(--mono);font-size:10px;letter-spacing:.16em;padding:6px 14px;border:1px solid var(--border);border-radius:6px;color:var(--text-soft);cursor:pointer;transition:all .2s;min-width:96px;text-align:center;background:#fff}
  .mgr-state:hover{border-color:var(--blue)}
  .mgr-state.is-shared{border-color:var(--purple);color:var(--purple);background:#efe9fe}
  .mgr-state.is-pool{border-color:var(--cyan);color:var(--cyan);background:#e6f7fb}
  .mgr-del{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;font-family:var(--serif);padding:0 6px;line-height:1}
  .mgr-del:hover{color:var(--pink)}
  .mgr-actions{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
  .mgr-empty{text-align:center;padding:30px;color:var(--muted);font-style:italic;font-family:var(--serif)}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
  .conf-piece{position:absolute;top:0;width:8px;height:14px;border-radius:2px;opacity:0;will-change:transform,opacity}

  @media (max-width:720px){
    .wrap{padding:36px 18px 60px}
    .status{grid-template-columns:1fr}
    .drawn-grid{gap:22px}
    .avatar.drawn-big{width:100px;height:100px;font-size:38px}
    .add-row{flex-direction:column}
  }
</style>
</head>
<body>
<svg class="doodle d1" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
<svg class="doodle d2" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3l9 16H3z"/></svg>
<svg class="doodle d3" width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="2.6"/><circle cx="4" cy="6" r="1.4"/><circle cx="20" cy="18" r="1.4"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="19" r="1"/></svg>
<svg class="doodle d4" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 2l9 5v10l-9 5-9-5V7z"/></svg>
<svg class="doodle d5" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2v20M2 12h20"/></svg>
<svg class="doodle d6" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="12" r="3"/></svg>

<div class="wrap">
  <header>
    <svg class="emblem" viewBox="0 0 64 64" fill="none" stroke="url(#g1)" stroke-width="1.8">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
      <circle cx="32" cy="32" r="26"/>
      <path d="M21 37c4 5 18 5 22 0"/>
      <circle cx="24" cy="26" r="2.2" fill="#06b6d4" stroke="none"/>
      <circle cx="40" cy="26" r="2.2" fill="#8b5cf6" stroke="none"/>
      <path d="M32 4v6M32 54v6M4 32h6M54 32h6" stroke-linecap="round"/>
    </svg>
    <div class="eyebrow">Team Sharing · 民主生活会</div>
    <h1>团队分享抽选</h1>
    <div class="sub">随机抽选同事开启下一次分享，轻松、公平、有点小惊喜</div>
    <div class="ribbon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.5 5 5.5.8-4 3.9.9 5.5L12 19l-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"/></svg>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.5 5 5.5.8-4 3.9.9 5.5L12 19l-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg>
    </div>
  </header>

  <section class="drawn" id="drawnSection">
    <div class="drawn-label" id="drawnLabel">本次中选</div>
    <div class="drawn-grid" id="drawnGrid">
      <div class="drawn-empty" id="drawnEmpty">点击下方按钮，开启本轮抽选</div>
    </div>
  </section>

  <div class="controls">
    <label class="pick-count"><span>抽取人数</span><input type="number" id="pickCount" min="1" max="3" value="3"></label>
    <button class="btn primary" id="drawBtn">开始抽取</button>
    <button class="btn ghost" id="mgrBtn">人员管理</button>
    <button class="btn ghost" id="resetBtn">重置已分享</button>
  </div>

  <section class="status">
    <div class="col pool">
      <div class="col-head">
        <div class="col-title"><span class="dot"></span>待抽池</div>
        <div class="col-count" id="poolCount">0 人</div>
      </div>
      <div class="grid" id="poolGrid"></div>
    </div>
    <div class="col shared">
      <div class="col-head">
        <div class="col-title"><span class="dot"></span>已分享</div>
        <div class="col-count" id="sharedCount">0 人</div>
      </div>
      <div class="grid" id="sharedGrid"></div>
    </div>
  </section>

  <div class="note"><span class="hr"></span>愿每一次分享，都是轻松的相聚<span class="hr"></span></div>
</div>

<div class="overlay" id="mgrOverlay">
  <div class="modal">
    <button class="close" id="mgrClose" aria-label="关闭">×</button>
    <h2>人员管理</h2>
    <div class="hint">在下方批量添加姓名（每行一个，自动去重）；列表中点状态切换 待分享/已分享，点 × 移除。所有改动自动持久化保存。</div>
    <div class="sec-title">添加人员</div>
    <div class="add-row">
      <textarea id="rosterInput" placeholder="张三&#10;李四&#10;王五"></textarea>
      <div class="add-side">
        <button class="btn primary" id="addBtn" style="font-size:11px;padding:10px 18px">添加</button>
        <button class="btn ghost" id="clearInputBtn" style="font-size:10px;padding:8px 14px">清空</button>
      </div>
    </div>
    <div class="sec-title">人员列表</div>
    <div class="mgr-list" id="mgrList"></div>
    <div class="mgr-actions">
      <button class="btn ghost" id="mgrAllPool">全部设为待分享</button>
      <button class="btn ghost" id="mgrAllShared">全部设为已分享</button>
    </div>
    <div class="modal-actions">
      <button class="btn primary" id="mgrDone">完成</button>
    </div>
  </div>
</div>

<div class="overlay" id="resetOverlay">
  <div class="modal">
    <button class="close" id="resetClose" aria-label="关闭">×</button>
    <h2>重置已分享</h2>
    <div class="hint">确认后将清空已分享记录，所有人回到待抽池。</div>
    <div class="modal-actions">
      <button class="btn ghost" id="resetCancel">取消</button>
      <button class="btn primary" id="resetConfirm">确认重置</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="confetti"></div>

<script>
(function(){
  "use strict";
  var KEY_ROSTER="shareRoster";
  var KEY_DRAWN="shareDrawn";
  var KEY_PICK="sharePickCount";

  var memStore={};
  function lsGet(k){try{return localStorage.getItem(k);}catch(e){return memStore.hasOwnProperty(k)?memStore[k]:null;}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){memStore[k]=v;}}

  var roster=load(KEY_ROSTER,[]);
  var drawn=load(KEY_DRAWN,[]);
  var pickCount=parseInt(lsGet(KEY_PICK),10);if(!(pickCount>0))pickCount=3;

  function load(k,def){try{var v=JSON.parse(lsGet(k));return Array.isArray(v)?v:def;}catch(e){return def;}}
  function persist(){
    lsSet(KEY_ROSTER,JSON.stringify(roster));
    lsSet(KEY_DRAWN,JSON.stringify(drawn));
    lsSet(KEY_PICK,String(pickCount));
  }

  var $=function(id){return document.getElementById(id);};
  var drawnGrid=$("drawnGrid"),drawnEmpty=$("drawnEmpty"),drawnLabel=$("drawnLabel");
  var poolGrid=$("poolGrid"),sharedGrid=$("sharedGrid");
  var poolCount=$("poolCount"),sharedCount=$("sharedCount");
  var pickInput=$("pickCount"),drawBtn=$("drawBtn");
  var toastEl=$("toast");

  var TONES=["tone-1","tone-2","tone-3","tone-4","tone-5"];
  function toneOf(name){var h=0;for(var i=0;i<name.length;i++){h=(h*31+name.charCodeAt(i))>>>0;}return TONES[h%TONES.length];}
  function addTone(el,name){var t=toneOf(name);if(t)el.classList.add(t);}

  function avatarText(name){name=String(name).trim();if(!name)return "·";return name.slice(-2);}
  function avatarLenCls(name){return avatarText(name).length===2?" len2":"";}

  function toast(msg){toastEl.textContent=msg;toastEl.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){toastEl.classList.remove("show");},2600);}

  function avatarEl(name,opts){
    opts=opts||{};
    var d=document.createElement("div");d.className="person";
    var a=document.createElement("div");
    a.className="avatar"+avatarLenCls(name)+(opts.big?" drawn-big":"")+(opts.shared?" is-shared":"")+(opts.spinning?" spinning":"");
    if(!opts.big&&!opts.shared) addTone(a,name);
    a.textContent=avatarText(name);
    var n=document.createElement("div");n.className="name"+(opts.big?" drawn-name":"");n.textContent=name;
    d.appendChild(a);d.appendChild(n);
    return d;
  }
  function emptyHint(text){var d=document.createElement("div");d.style.cssText="grid-column:1/-1;text-align:center;font-family:var(--serif);font-style:italic;color:var(--muted);padding:18px 0;font-size:15px";d.textContent=text;return d;}

  function render(){
    var pool=roster.filter(function(n){return drawn.indexOf(n)===-1;});
    poolGrid.innerHTML="";
    if(roster.length===0){poolGrid.appendChild(emptyHint("名单为空，请先「人员管理」录入人员"));}
    else if(pool.length===0){poolGrid.appendChild(emptyHint("本轮已全部完成，可「重置已分享」开启新一轮"));}
    else{pool.forEach(function(n){poolGrid.appendChild(avatarEl(n));});}
    poolCount.textContent=pool.length+" 人";

    sharedGrid.innerHTML="";
    if(drawn.length===0){sharedGrid.appendChild(emptyHint("尚无已分享人员"));}
    else{drawn.forEach(function(n){sharedGrid.appendChild(avatarEl(n,{shared:true}));});}
    sharedCount.textContent=drawn.length+" 人";

    var max=pool.length||1;
    pickInput.max=max;
    pickInput.value=Math.max(1,Math.min(pickCount,max));
    drawBtn.disabled=(pool.length===0);
  }

  function renderDrawn(names){
    drawnGrid.innerHTML="";
    if(drawnEmpty)drawnEmpty.style.display="none";
    if(!names||names.length===0){
      drawnLabel.textContent="本次中选";
      var e=document.createElement("div");e.className="drawn-empty";e.id="drawnEmpty";e.textContent="点击下方按钮，开启本轮抽选";drawnGrid.appendChild(e);return;
    }
    drawnLabel.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.5 5 5.5.8-4 3.9.9 5.5L12 19l-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg>恭喜本次中选 · '+names.length+' 位';
    names.forEach(function(n){drawnGrid.appendChild(avatarEl(n,{big:true}));});
  }

  function fisherYates(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

  function doDraw(){
    var pool=roster.filter(function(n){return drawn.indexOf(n)===-1;});
    if(pool.length===0){toast("待抽池为空，请重置后继续");return;}
    var n=Math.min(pickCount,pool.length);
    if(n<1){toast("抽取人数须至少为 1");return;}
    drawBtn.disabled=true;
    var spinSlots=[];
    for(var i=0;i<n;i++){
      var p=document.createElement("div");p.className="person";
      var a=document.createElement("div");a.className="avatar drawn-big spinning";
      var nm=document.createElement("div");nm.className="name drawn-name";nm.textContent="···";
      a.textContent="·";p.appendChild(a);p.appendChild(nm);drawnGrid.appendChild(p);
      spinSlots.push({a:a,nm:nm});
    }
    if(drawnEmpty)drawnEmpty.style.display="none";
    drawnLabel.textContent="抽选中…";
    var spinNames=pool.slice(),ticks=0,maxTicks=16;
    var timer=setInterval(function(){
      ticks++;
      spinSlots.forEach(function(s){
        var r=spinNames[Math.floor(Math.random()*spinNames.length)];
        var t=avatarText(r);
        s.a.textContent=t;s.a.className="avatar drawn-big spinning"+(t.length===2?" len2":"");
        s.nm.textContent=r;
      });
      if(ticks>=maxTicks){clearInterval(timer);finalizeDraw(n);}
    },85);
  }

  function finalizeDraw(n){
    var pool=roster.filter(function(x){return drawn.indexOf(x)===-1;});
    var picked=fisherYates(pool).slice(0,n);
    picked.forEach(function(p){if(drawn.indexOf(p)===-1)drawn.push(p);});
    persist();renderDrawn(picked);render();confettiBurst();toast("抽取完成");
  }

  var confettiEl=$("confetti");
  var CONF_COLORS=["#06b6d4","#3b82f6","#8b5cf6","#0d9488","#db2777","#1f2937"];
  function confettiBurst(){
    var cx=window.innerWidth/2, cy=window.innerHeight*0.36;
    for(var i=0;i<50;i++){
      var p=document.createElement("div");p.className="conf-piece";
      p.style.background=CONF_COLORS[i%CONF_COLORS.length];
      var ang=Math.random()*Math.PI*2,sp=120+Math.random()*280;
      var dx=Math.cos(ang)*sp,dy=Math.sin(ang)*sp-90;
      var rot=Math.random()*720-360;
      var dur=900+Math.random()*900;
      p.style.left=cx+"px";p.style.top=cy+"px";
      confettiEl.appendChild(p);
      (function(el,dx,dy,rot,dur){
        el.animate([
          {transform:"translate(0,0) rotate(0)",opacity:1},
          {transform:"translate("+dx+"px,"+dy+"px) rotate("+rot+"deg)",opacity:0}
        ],{duration:dur,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=function(){el.remove();};
      })(p,dx,dy,rot,dur);
    }
  }

  drawBtn.addEventListener("click",doDraw);
  pickInput.addEventListener("change",function(){
    var v=parseInt(pickInput.value,10);
    var pool=roster.filter(function(n){return drawn.indexOf(n)===-1;});
    var max=Math.max(1,pool.length||1);
    if(!(v>0))v=1;if(v>max)v=max;pickCount=v;pickInput.value=v;persist();
  });

  var mgrOverlay=$("mgrOverlay"),mgrList=$("mgrList"),rosterInput=$("rosterInput");
  function openMgr(){renderMgr();mgrOverlay.classList.add("show");setTimeout(function(){rosterInput.focus();},50);}
  function renderMgr(){
    mgrList.innerHTML="";
    if(roster.length===0){mgrList.innerHTML='<div class="mgr-empty">名单为空，请在上方添加人员</div>';return;}
    roster.forEach(function(n){
      var shared=drawn.indexOf(n)!==-1;
      var row=document.createElement("div");row.className="mgr-row";
      var av=document.createElement("div");
      av.className="avatar"+avatarLenCls(n)+(shared?" is-shared":"");
      if(!shared)addTone(av,n);
      av.textContent=avatarText(n);
      var nm=document.createElement("div");nm.className="mgr-name";nm.textContent=n;
      var st=document.createElement("div");
      st.className="mgr-state"+(shared?" is-shared":" is-pool");
      st.textContent=shared?"已分享":"待分享";
      st.addEventListener("click",function(){
        if(shared){drawn=drawn.filter(function(x){return x!==n;});}else{drawn.push(n);}
        persist();renderMgr();render();
      });
      var del=document.createElement("button");del.className="mgr-del";del.textContent="×";del.title="移除";
      del.addEventListener("click",function(){
        roster=roster.filter(function(x){return x!==n;});
        drawn=drawn.filter(function(x){return x!==n;});
        persist();renderMgr();render();
      });
      row.append(av,nm,st,del);mgrList.appendChild(row);
    });
  }
  $("mgrBtn").addEventListener("click",openMgr);
  $("mgrClose").addEventListener("click",function(){mgrOverlay.classList.remove("show");});
  $("mgrDone").addEventListener("click",function(){mgrOverlay.classList.remove("show");toast("人员状态已保存");});
  function addFromInput(){
    var lines=rosterInput.value.split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){return s.length>0;});
    var seen={},added=0;
    lines.forEach(function(l){if(!roster.some(function(r){return r===l;})&&!seen[l]){seen[l]=1;roster.push(l);added++;}});
    rosterInput.value="";persist();renderMgr();render();toast(added?"已添加 "+added+" 人":"无新增姓名（已去重）");
  }
  $("addBtn").addEventListener("click",addFromInput);
  $("clearInputBtn").addEventListener("click",function(){rosterInput.value="";rosterInput.focus();});
  rosterInput.addEventListener("keydown",function(e){if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();addFromInput();}});

  $("mgrAllPool").addEventListener("click",function(){drawn=[];persist();renderMgr();render();toast("全部设为待分享");});
  $("mgrAllShared").addEventListener("click",function(){drawn=roster.slice();persist();renderMgr();render();toast("全部设为已分享");});

  var resetOverlay=$("resetOverlay");
  $("resetBtn").addEventListener("click",function(){resetOverlay.classList.add("show");});
  $("resetClose").addEventListener("click",function(){resetOverlay.classList.remove("show");});
  $("resetCancel").addEventListener("click",function(){resetOverlay.classList.remove("show");});
  $("resetConfirm").addEventListener("click",function(){
    drawn=[];persist();render();renderDrawn([]);resetOverlay.classList.remove("show");toast("已分享状态已重置");
  });

  [mgrOverlay,resetOverlay].forEach(function(ov){ov.addEventListener("click",function(e){if(e.target===ov)ov.classList.remove("show");});});
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){mgrOverlay.classList.remove("show");resetOverlay.classList.remove("show");}
  });

  render();
})();
</script>
</body>
</html>
